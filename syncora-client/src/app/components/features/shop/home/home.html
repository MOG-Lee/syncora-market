<div class="bg-light pb-5">
     <div class="position-relative w-100" style="background: #232f3e; min-height: 400px;">
          <div class="h-100 w-100" style="background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(244,246,248,1) 100%); 
            position: absolute; bottom: 0;">
          </div>

          <div class="container position-relative z-1 pt-3 text-center text-white">
               <h1 class="display-5 fw-bold">Welcome to Syncora</h1>
               <p class="lead">The distributed marketplace for professionals.</p>
               <button class="btn btn-warning btn-lg px-5 fw-bold shadow">
                    Browse Deals
               </button>
          </div>
     </div>

     <div class="container-fluid app-container" style="margin-top: -185px; position: relative; z-index: 2;">

          <div class="row g-3 mb-4">
               @for (cat of categories; track cat.name){
               <div class="col-6 col-md-4 col-lg-3">
                    <div class="card border-0 shadow-sm h-100 overflow-hidden">
                         <div class="card-body d-flex flex-column text-center">
                              <img [src]="cat.image | productImg:'m'"
                                   class="img-fluid mb-1 rounded flex-grow-1 object-fit-cover" alt="Category"
                                   style="max-height: 250px;">
                              <h6 class="fw-bold text-dark mb-1">{{ cat.name }}</h6>
                              <a href="#" class="text-decoration-none stretched-link">See more</a>
                         </div>
                    </div>
               </div>
               }
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3 px-2">
               <h3 class="fw-bold m-0">Today's Recommendations</h3>
          </div>

          <div class="row g-3 mb-4">
               @for(item of products; track item.id){
               <div class="col-6 col-md-4 col-lg-3">
                    <app-product-card [product]="item"></app-product-card>
               </div>
               }
          </div>

          <!-- @if (isLoading) {
          <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3 mt-2">

                                   <span class="placeholder col-6"></span>
                              </h5>
                         </div>
                    </div>
               </div>
               }
          </div>
          } -->

     </div>
</div>
