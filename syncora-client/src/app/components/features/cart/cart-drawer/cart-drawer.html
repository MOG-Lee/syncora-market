@if (isOpen()) {
<div class="offcanvas-backdrop fade show" (click)="close()"></div>
}

<div class="offcanvas offcanvas-end shadow" [class.show]="isOpen()" tabindex="-1" id="cartDrawer"
    style="visibility: visible; transition: transform 0.3s ease-in-out;">

    <div class="offcanvas-header bg-light border-bottom">
        <h5 class="offcanvas-title fw-bold">
            <i class="bi bi-cart3 me-2"></i>Your Cart
        </h5>
        <button type="button" class="btn-close" (click)="close()"></button>
    </div>

    <div class="offcanvas-body d-flex flex-column p-0">

        @if (items().length === 0) {
        <div class="h-100 d-flex flex-column align-items-center justify-content-center text-muted p-4">
            <i class="bi bi-cart-x display-1 mb-3 opacity-25"></i>
            <h5>Your cart is empty</h5>
            <button class="btn btn-primary mt-3" (click)="close()">Start Shopping</button>
        </div>
        } @else {
        <div class="flex-grow-1 overflow-auto p-3">
            @for (item of items(); track item.product.id) {
            <div class="d-flex align-items-center mb-4 pb-3 border-bottom">

                <div class="flex-shrink-0 border rounded p-1">
                    <img [src]="item.product.imageFileName | productImg:'s'" class="object-fit-contain" width="60"
                        height="60" [alt]="item.product.name">
                </div>

                <div class="flex-grow-1 ms-3">
                    <h6 class="mb-0 text-truncate" style="max-width: 180px;">{{ item.product.name }}</h6>
                    <small class="text-muted">{{ item.product.price | currency }}</small>

                    <div class="d-flex align-items-center mt-2">
                        <div class="input-group input-group-sm" style="width: 100px;">
                            <button class="btn btn-outline-secondary"
                                (click)="decrease(item.product.id, item.quantity)">-</button>
                            <span class="form-control text-center bg-white border-secondary">{{ item.quantity }}</span>
                            <button class="btn btn-outline-secondary"
                                (click)="increase(item.product.id, item.quantity)">+</button>
                        </div>

                        <button class="btn btn-link btn-sm text-danger text-decoration-none ms-auto"
                            (click)="remove(item.product.id)">
                            Remove
                        </button>
                    </div>
                </div>
            </div>
            }
        </div>

        <div class="p-3 bg-light border-top">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="text-muted">Subtotal</span>
                <span class="fs-4 fw-bold">{{ total() | currency }}</span>
            </div>
            <button class="btn btn-warning w-100 fw-bold py-2 shadow-sm" (click)="proceedToCheckout()">
                Proceed to Checkout
            </button>
        </div>
        }
    </div>
</div>
