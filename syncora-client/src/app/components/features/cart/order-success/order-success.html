<div class="min-vh-100 d-flex flex-column align-items-center justify-content-center text-center py-5">
    <div class="mb-4 text-success">
        <i class="bi bi-check-circle-fill display-1"></i>
    </div>

    <h1 class="fw-bold mb-3">Order Placed Successfully!</h1>
    <p class="lead text-muted mb-4">Thank you for shopping with Syncora.</p>

    <div class="card border-0 shadow-sm p-4 mb-4 bg-light" style="max-width: 400px; width: 100%;">
        <span class="text-uppercase small text-muted fw-bold">Order Number</span>
        <h3 class="fw-bold text-dark m-0">{{ orderId() }}</h3>
    </div>

    <p class="mb-4">We've sent a confirmation email to your inbox.</p>

    <div class="d-flex gap-3">
        <a routerLink="/" class="btn btn-primary px-4 fw-bold">Continue Shopping</a>
        <a routerLink="/my-orders" class="btn btn-outline-secondary px-4">View Order</a>
    </div>
</div>
