<div class="container-fluid py-4">
    <h2 class="fw-bold mb-4">Checkout</h2>

    <div class="row g-5">

        <div class="col-md-8">
            <form [formGroup]="checkoutForm" (ngSubmit)="placeOrder()" id="checkoutForm">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-bold"><i class="bi bi-truck me-2"></i>Shipping Address</h5>
                    </div>

                    <div class="card-body p-4">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">First name</label>
                                <input type="text" class="form-control" formControlName="firstName"
                                    [class.is-invalid]="checkoutForm.get('firstName')?.invalid && checkoutForm.get('firstName')?.touched">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Last name</label>
                                <input type="text" class="form-control" formControlName="lastName">
                            </div>

                            <div class="col-12">
                                <label class="form-label small fw-bold">Email</label>
                                <input type="email" class="form-control" formControlName="email"
                                    placeholder="you@example.com">
                            </div>

                            <div class="col-12">
                                <label class="form-label small fw-bold">Address</label>
                                <input type="text" class="form-control" formControlName="address"
                                    placeholder="1234 Main St">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-bold">City</label>
                                <input type="text" class="form-control" formControlName="city">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Zip Code</label>
                                <input type="text" class="form-control" formControlName="zip">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-bold"><i class="bi bi-credit-card me-2"></i>Payment Method</h5>
                    </div>
                    <div class="card-body p-4">
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="radio" formControlName="paymentMethod" value="card"
                                id="creditCard">
                            <label class="form-check-label fw-bold" for="creditCard">Credit or Debit Card</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" formControlName="paymentMethod" value="paypal"
                                id="paypal">
                            <label class="form-check-label fw-bold" for="paypal">PayPal</label>
                        </div>

                        <div class="row g-3 mt-2 p-3 bg-light rounded border">
                            <div class="col-md-6">
                                <label class="form-label small">Name on card</label>
                                <input type="text" class="form-control form-control-sm">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small">Credit card number</label>
                                <input type="text" class="form-control form-control-sm">
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm border-0 sticky-top" style="top: 20px;">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-3"> Order Summary</h5>

                    <div class="d-flex justify-content-between mb-2 small">
                        <span class="text-muted">Items ({{ cartCount() }}):</span>
                        <span>{{subTotal() | currency }}</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2 small">
                        <span class="text-muted">Shipping:</span>
                        <span class="text-success">Free</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3 small">
                        <span class="text-muted">Tax:</span>
                        <span>$0.00</span>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-between mb-4">
                        <span class="fs-5 fw-bold ">Order Total:</span>
                        <span class="fs-5 fw-bold ">{{ subTotal() | currency }}</span>
                    </div>

                    <button class="btn btn-warning w-100 py-2 fw-bold shadow-sm" type="submit" form="checkoutForm"
                        [disabled]="isProcessing() || cartCount() === 0">
                        @if(isProcessing()) {
                        <span class="spinner-border spinner-border-sm me-2"></span>Processing...
                        } @else {
                        Place Your Order
                        }
                    </button>
                    <p class="small text-muted text-center mt-3 mb-0">
                        By placing your order, you agree to Syncora's privacy notice and conditions of use.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
