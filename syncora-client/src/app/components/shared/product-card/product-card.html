<div class="card h-100 border-0 shadow-sm product-card">
    <a [routerLink]="['/product', product.id]" class="text-decoration-none">
        <div class="position-relative p-3 text-center bg-white image-container">
            <img [src]="product.imageFileName | productImg:'m'" [alt]="product.name"
                class="img-fluid object-fit-contain h-100 w-100">

            @if (product.price <= 500) {
            <span class="position-absolute top-0 start-0 badge bg-danger m-2 shadow-sm">
                Flash Deal
            </span>
            }
        </div>
    </a>

    <div class="card-body d-flex flex-column p-3">
        <small class="text-muted mb-1 vendor-text">Syncora</small>
        <a [routerLink]="['/product', product.id]" class="text-decoration-none text-dark">
            <h5 class="card-title text-truncate-2 mb-2" [title]="product.name">
                {{ product.name }}
            </h5>
        </a>

        <div class="mb-2 small text-warning d-flex align-items-center">
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-half"></i>
            <span class="text-muted ms-1 text-black-50">({{ 4 }})</span>
        </div>

        <div class="mt-auto d-flex align-items-end justify-content-between">

            <div class="d-flex flex-column">
                <span class="fs-5 fw-bold text-dark">{{ product.price | currency }}</span>

                @if(product.price <= 500) {
                <small class="text-decoration-line-through text-muted original-price">
                    {{ product.price * 1.2 | currency }}
                </small>
                }
            </div>

            <button class="btn btn-primary rounded-circle shadow-sm btn-add" (click)="addToCart($event)"
                title="Add to Cart">
                <i class="bi bi-plus-lg"></i>
            </button>
        </div>
    </div>
</div>
