<header>
    <nav class="navbar navbar-dark bg-primary py-3">
        <div class="container-fluid gap-3 align-items-center">

            <div class="d-flex align-items-center">
                <button class="navbar-toggler d-lg-none border-0 me-2">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <a routerLink="/" class="navbar-brand m-0 p-0 d-flex align-items-center">
                    <img src="/images/menu-icon.png" alt="Logo" style="height: 40px; width: 50px;">
                    <span class="fw-bold text-white fs-4">Syncora</span>
                </a>
            </div>

            <div class="flex-grow-1 d-none d-md-flex">
                <div class="input-group">
                    <button class="btn btn-light dropdown-toggle bg-gray-200 border-0" type="button">All</button>
                    <input #searchInput1 type="text" class="form-control border-0" placeholder="Search for products..."
                        (keyup.enter)="onSearch(searchInput1.value)">
                    <button class="btn btn-warning text-dark" type="button" (click)="onSearch(searchInput1.value)">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </div>

            <div class="d-flex align-items-center gap-3 text-white">
                <a routerLink="/login" class="text-decoration-none text-white d-flex flex-column lh-1">
                    <small class="d-none d-lg-block" style=" opacity: 0.8">Hello, sign in</small>
                    <span class="d-none d-lg-block fw-bold">Account & Lists</span>
                    <i class="bi bi-person d-lg-none fs-4"></i>
                </a>

                <a (click)="toggleCart()"
                    class="text-decoration-none text-white position-relative d-flex align-items-center"
                    style="cursor: pointer;">
                    <i class="bi bi-cart3 fs-3"></i>
                    <div class="ms-1 lh-1 d-none d-md-block">
                        <span class="fw-bold mt-2">Cart</span>
                    </div>
                    <span class="position-absolute start-50 translate-middle-x badge rounded-pill bg-danger"
                        style="top: -11px;">
                        {{ cartCount()}}
                        <span class="visually-hidden">items in cart</span>
                    </span>
                </a>
            </div>
        </div>
    </nav>

    <div class="bg-primary p-2 pt-0 d-md-none">
        <div class="input-group">
            <input #searchInput2 type="text" class="form-control border-0" placeholder="Search for products..."
                (keyup.enter)="onSearch(searchInput2.value)">
            <button class="btn btn-warning text-dark" type="button" (click)="onSearch(searchInput2.value)">
                <i class="bi bi-search"></i>
            </button>
        </div>
    </div>

    <div class="bg-dark text-white py-1 px-3 d-flex gap-3 overflow-auto small text-nowrap">
        <a href="#" class="text-white text-decoration-none fw-bold"><i class="bi bi-list"></i> All</a>
        <a href="#" class="text-white text-decoration-none">Today's Deals</a>
        <a href="#" class="text-white text-decoration-none">Customer Service</a>
        <a href="#" class="text-white text-decoration-none">Registry</a>
        <a href="#" class="text-white text-decoration-none">Gift Cards</a>
        <a href="#" class="text-white text-decoration-none">Sell</a>
    </div>


</header>
